  <style>
    html,
    body {
      background-color: #151515;
      margin: 0;
      height: 100%;
      overflow: hidden;
    }

    /* Loader container */
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #151515;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.1s ease-out;
    }

    #loading.fade-out {
      opacity: 0;
    }

    /* Spinning logo */
    #loading img {
      width: 80px;
      height: 80px;
      animation: spin 1s linear infinite;
      margin-bottom: 30px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Bubble loader (horizontal dots) */
    .bubble-loader {
      display: flex;
      gap: 10px;
    }

    .bubble-loader div {
      width: 7px;
      height: 7px;
      background: white;
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
    }

    .bubble-loader div:nth-child(1) { animation-delay: 0s; }
    .bubble-loader div:nth-child(2) { animation-delay: 0.2s; }
    .bubble-loader div:nth-child(3) { animation-delay: 0.4s; }
    .bubble-loader div:nth-child(4) { animation-delay: 0.6s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
  </style>
</head>

<body>
  <!-- Loader -->
  <div id="loading">
    <img src="favicon.png" alt="Logo" />
    <div class="bubble-loader">
      <div></div>
      <div></div>
      <div></div>
      <div></div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script type="module">
    import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.9.155/pdf.min.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.9.155/pdf.worker.min.mjs";

    // IMPORTANT: Wait for Flutter to be fully ready before hiding loader
    window.addEventListener('flutter-first-frame', function() {
      const loader = document.getElementById('loading');
      if (loader) {
        loader.classList.add('fade-out');
        setTimeout(() => {
          loader.style.display = 'none';
        }, 100); // Match the CSS transition duration
      }
    });
  </script>
</body>
